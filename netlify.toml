[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"

# Docs are served from the site root; keep the old /docs/* URLs working.
[[redirects]]
  from = "/docs/quick-start"
  to = "/"
  status = 301

[[redirects]]
  from = "/docs/codevideo-rest-api"
  to = "/api"
  status = 301

[[redirects]]
  from = "/docs"
  to = "/"
  status = 301

[[redirects]]
  from = "/docs/*"
  to = "/:splat"
  status = 301
